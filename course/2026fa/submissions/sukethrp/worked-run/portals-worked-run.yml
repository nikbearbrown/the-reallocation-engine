# Discovery config for the worked run (sukethrp · ml-newgrad-sponsor-match).
# Used with the engine's own scanner, not by the prototype:
#   REALLOCATION_ENGINE_PORTALS=course/2026fa/submissions/sukethrp/worked-run/portals-worked-run.yml npm run ats:scan -- --dry-run
# Companies were picked across the recipe's tiers from the rules audit (Proven, Likely, Unknown, and
# not-in-file). Board slugs are guesses; the scan reports any board that does not exist.
# Filters are plain case-insensitive substrings (scripts/ats/scan.mjs), so they are deliberately loose.

title_filter:
  positive:
    - "machine learning"
    - "ml engineer"
    - "ai engineer"
    - "applied ai"
    - "applied scientist"
    - "deep learning"
    - "computer vision"
    - "nlp"
    - "llm"
    - "ai/ml"
    - "ml/ai"
    - "mlops"
    - "new grad"
    - "university grad"
    - "early career"
  negative:
    - "senior"
    - "sr."
    - "sr "
    - "staff"
    - "principal"
    - "lead"
    - "manager"
    - "director"
    - "head of"
    - "intern"
    - "architect"

location_filter:
  always_allow: ["united states", "usa", "remote - us", "remote (us)", "us remote", "u.s."]
  block: ["canada", "london", "united kingdom", "india", "germany", "ireland", "toronto", "singapore", "japan", "australia", "brazil", "poland", "amsterdam", "paris", "israel", "tel aviv", "mexico", "spain", "netherlands"]
  allow: [", ca", ", ny", ", wa", ", ma", ", tx", ", il", "san francisco", "new york", "seattle", "boston", "cambridge", "austin", "chicago", "remote"]

